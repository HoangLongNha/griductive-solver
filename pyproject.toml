[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "griductive-solver"
version = "0.1.0"
requires-python = ">=3.11"
description = "Griductive logic puzzle solver"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jsonschema>=4.20,<5"]

[tool.setuptools.packages.find]
where = ["src"]
